schema_version: 1
task_ref:
  packet_id: EP-004
  phase: DOCS_CLEANUP
  attempt: 1
  executor_model: deepseek-v4-flash
  parent_packet_id: EP-003
summary: "Archive legacy top-level phase docs and rewrite docs links to canonical + archived locations"
execution_policy:
  task_class: docs
  risk_level: low
  finalize_git: false
scope:
  in:
    - "Move legacy top-level phase docs under .opencode/DEVELOPMENT_DOCS/archive/completed-phases/"
    - "Rewrite affected links across DEVELOPMENT_DOCS so no broken references remain"
    - "Keep canonical docs pointing to CURRENT_STATUS, ROADMAP, and PHASE_STATUS_MATRIX"
    - "Perform a lightweight duplicate-link sweep in .opencode/DEVELOPMENT_DOCS/README.md"
  out:
    - "No code changes outside DEVELOPMENT_DOCS"
    - "Do not alter product requirements or roadmap intent"
    - "Do not delete historical content"
doc_allow_list:
  - "AGENTS.md"
  - ".opencode/DEVELOPMENT_DOCS/bootstrap/AGENT_START.md"
  - ".opencode/DEVELOPMENT_DOCS/state/CURRENT_STATUS.md"
  - ".opencode/DEVELOPMENT_DOCS/state/ROADMAP.md"
  - ".opencode/DEVELOPMENT_DOCS/README.md"
  - ".opencode/DEVELOPMENT_DOCS/state/PHASE_STATUS_MATRIX.md"
  - ".opencode/DEVELOPMENT_DOCS/archive/completed-phases/"
code_targets:
  - ".opencode/DEVELOPMENT_DOCS/README.md"
  - ".opencode/DEVELOPMENT_DOCS/bootstrap/AGENT_START.md"
  - ".opencode/DEVELOPMENT_DOCS/state/PHASE_STATUS_MATRIX.md"
  - ".opencode/DEVELOPMENT_DOCS/archive/completed-phases/PHASE7_FONT_SYSTEM.md"
  - ".opencode/DEVELOPMENT_DOCS/archive/completed-phases/PHASE7_FONT_SYSTEM_COMPLETE.md"
  - ".opencode/DEVELOPMENT_DOCS/archive/completed-phases/PHASE8_PAGE_SYSTEM_REFACTOR.md"
  - ".opencode/DEVELOPMENT_DOCS/archive/completed-phases/PHASE12_TENANT_RUNTIME_READINESS.md"
  - ".opencode/DEVELOPMENT_DOCS/archive/completed-phases/PHASE13_BOOKING_SYSTEM.md"
  - ".opencode/DEVELOPMENT_DOCS/archive/completed-phases/"
acceptance_criteria:
  - id: AC-1
    text: "Legacy top-level phase docs are moved to .opencode/DEVELOPMENT_DOCS/archive/completed-phases without content loss"
  - id: AC-2
    text: "DEVELOPMENT_DOCS markdown links remain valid after move (no broken references in touched docs)"
  - id: AC-3
    text: "Canonical navigation docs still direct readers to current truth and phase matrix"
verification:
  commands:
    - "rg -n \"PHASE7_FONT_SYSTEM|PHASE8_PAGE_SYSTEM_REFACTOR|PHASE12_TENANT_RUNTIME_READINESS|PHASE13_BOOKING_SYSTEM\" DEVELOPMENT_DOCS"
    - "git diff -- DEVELOPMENT_DOCS"
stop_conditions:
  - "OpenCode API unavailable"
  - "Missing OPENCODE_USER or OPENCODE_PASS"
  - "Any link rewrite would require cross-repo changes outside DEVELOPMENT_DOCS"
