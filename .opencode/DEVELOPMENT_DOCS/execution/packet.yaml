schema_version: 1
task_ref:
  packet_id: EP-003
  phase: PHASE19
  attempt: 1
  executor_model: deepseek-v4-flash
  parent_packet_id: EP-002
summary: "Harden and complete the SQLite orchestration state workflow for token-efficient context retrieval"
execution_policy:
  task_class: minor
  risk_level: low
  finalize_git: false
scope:
  in:
    - "Ensure SQLite state commands are stable and warning-free"
    - "Ensure failed executor runs are represented in state and not overwritten by stale success artifacts"
    - "Document compact context query usage for token-efficient orchestration"
  out:
    - "Do not change OpenCode API authentication model"
    - "Do not refactor unrelated files"
doc_allow_list:
  - "AGENTS.md"
  - ".opencode/DEVELOPMENT_DOCS/bootstrap/AGENT_START.md"
  - ".opencode/DEVELOPMENT_DOCS/bootstrap/AI_ORCHESTRATOR_EXECUTOR_WORKFLOW.md"
  - ".opencode/DEVELOPMENT_DOCS/execution/OPENCODE_BROKER.md"
  - ".opencode/DEVELOPMENT_DOCS/execution/STATE_DB_GUIDE.md"
code_targets:
  - "scripts/opencode/"
  - "package.json"
  - ".opencode/DEVELOPMENT_DOCS/execution/OPENCODE_BROKER.md"
  - ".opencode/DEVELOPMENT_DOCS/execution/STATE_DB_GUIDE.md"
  - ".opencode/DEVELOPMENT_DOCS/execution/packet.yaml"
acceptance_criteria:
  - id: AC-1
    text: "state commands init/ingest/context execute without PHP warnings"
  - id: AC-2
    text: "Failed executor run cannot be ingested as stale success from an older artifact"
  - id: AC-3
    text: "Docs clearly describe compact context query flow for token-efficient orchestration"
verification:
  commands:
    - "npm run opencode:state:init"
    - "npm run opencode:state:ingest-packet -- --packet .opencode/DEVELOPMENT_DOCS/execution/packet.yaml"
    - "npm run opencode:state:context -- --packet-id EP-003 --limit 3"
    - "npm run opencode:run-auto -- --packet-id EP-003 --mode auto"
stop_conditions:
  - "OpenCode API unavailable"
  - "Missing OPENCODE_USER or OPENCODE_PASS"
  - "Proposed state changes conflict with workflow schema requirements"
