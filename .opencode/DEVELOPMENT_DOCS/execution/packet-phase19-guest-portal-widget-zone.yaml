schema_version: 1
task_ref:
  packet_id: EP-006
  phase: PHASE19
  attempt: 1
  executor_model: deepseek-v4-pro-medium
  parent_packet_id: EP-005
summary: "Phase 19 follow-on: add add-on-gated guest-portal widget zone and keep tenant login surface constrained"
execution_policy:
  task_class: feature
  risk_level: medium
  finalize_git: false
scope:
  in:
    - "Implement guest-portal widget-zone scaffolding for authenticated guest portal runtime"
    - "Gate widget availability by tenant add-ons with safe defaults"
    - "Preserve existing route-owned guest auth/session behavior"
    - "Keep tenant staff login system surface constrained as a lightweight branded utility surface"
  out:
    - "No customer-account/register/forgot/reset-password runtime work"
    - "No cross-tenant SSO or identity architecture changes"
    - "No broad refactor of existing booking or quotes domain logic"
doc_allow_list:
  - "AGENTS.md"
  - "DEVELOPMENT_DOCS/bootstrap/AGENT_START.md"
  - "DEVELOPMENT_DOCS/state/CURRENT_STATUS.md"
  - "DEVELOPMENT_DOCS/state/ROADMAP.md"
  - "DEVELOPMENT_DOCS/plans/PHASE19_SYSTEM_SURFACES.md"
  - "DEVELOPMENT_DOCS/policy/TESTING.md"
code_targets:
  - "resources/js/shared/puck/system-surfaces/SystemSurfaceConfig.ts"
  - "resources/js/apps/public/components/GuestPortalPage.tsx"
  - "resources/js/apps/public/components/guestPortal.service.ts"
  - "resources/js/apps/tenant/components/pages/SystemSurfaceEditorPage.tsx"
  - "resources/js/shared/services/api/types.ts"
  - "resources/js/apps/public/components/__tests__/GuestPortalPage.test.tsx"
  - "tests/e2e/guest-portal-shell.spec.ts"
acceptance_criteria:
  - id: AC-1
    text: "Guest portal runtime exposes a dedicated widget zone that can host add-on-gated widgets without breaking route-owned auth shell behavior"
  - id: AC-2
    text: "Widgets that require unavailable add-ons are hidden or replaced with explicit non-interactive fallback states"
  - id: AC-3
    text: "Tenant login surface remains constrained (no broad freeform widgetization)"
  - id: AC-4
    text: "Focused unit/browser coverage verifies widget-zone rendering and add-on gating behavior"
verification:
  commands:
    - "npm run test:run -- resources/js/apps/public/components/__tests__/guestPortal.service.test.ts resources/js/apps/public/components/__tests__/GuestPortalPage.test.tsx"
    - "npm run test:e2e -- tests/e2e/guest-portal-shell.spec.ts"
stop_conditions:
  - "Add-on entitlement source is ambiguous or missing for tenant context"
  - "Any change would weaken tenant/auth/guest route security boundaries"
  - "Implementation requires introducing customer-account flows outside current Phase 19 scope"
