name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_closeout_verification:
        description: Run the host-level staging closeout verification after deploy and smoke checks
        required: false
        type: boolean
        default: false
      clear_failed_jobs_backlog:
        description: Flush the already-triaged staging failed_jobs backlog after recording it in the workflow log
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_APP_PATH: /var/www/byteforge
        run: |
          # Validate required deployment secrets up front for clearer CI failures.
          missing=0
          for var in STAGING_HOST STAGING_USER STAGING_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Deployment aborted: configure required staging secrets in GitHub Actions settings."
            exit 1
          fi

          # Create SSH key from secret
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          # Add staging host to known_hosts
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Deploy via SSH
          ssh -T -o BatchMode=yes -o LogLevel=ERROR -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" 'bash -se' << 'ENDSSH'
            APP_PATH=/var/www/byteforge
            DEPLOY_GIT_KEY="$HOME/.ssh/github_deploy_key"

            abort() {
              echo "Deployment aborted: $1"
              exit 1
            }

            require_group_access() {
              local path="$1"
              local expected_group="$2"
              local minimum_group_digit="$3"
              local mode group_digit actual_group

              actual_group=$(stat -c '%G' "$path")
              mode=$(stat -c '%a' "$path")
              group_digit=${mode: -2:1}

              if [ "$actual_group" != "$expected_group" ]; then
                abort "$APP_PATH/$path must be group-owned by $expected_group (found: $actual_group)"
              fi

              if (( group_digit < minimum_group_digit )); then
                abort "$APP_PATH/$path must grant group permission >= $minimum_group_digit (mode: $mode)"
              fi
            }

            require_not_world_accessible() {
              local path="$1"
              local mode other_digit

              mode=$(stat -c '%a' "$path")
              other_digit=${mode: -1}

              if (( other_digit > 0 )); then
                abort "$APP_PATH/$path must not be world-accessible (mode: $mode)"
              fi
            }

            cd "$APP_PATH"

            if [ ! -r "$DEPLOY_GIT_KEY" ]; then
              abort "deploy user cannot read $DEPLOY_GIT_KEY"
            fi

            # Normalize ownership/permissions for deploy user and web group.
            # This prevents composer/npm/build/cache permission drift.
            if sudo -n true >/dev/null 2>&1; then
              if getent group www-data >/dev/null 2>&1; then
                sudo chown -R "$USER":www-data "$APP_PATH" || true
              else
                sudo chown -R "$USER":"$USER" "$APP_PATH" || true
              fi
            else
              echo "Sudo unavailable; relying on pre-provisioned ownership baseline."
            fi

            mkdir -p storage/framework/{sessions,views,cache/data} storage/logs bootstrap/cache
            if sudo -n true >/dev/null 2>&1; then
              if getent group www-data >/dev/null 2>&1; then
                sudo chgrp -R www-data storage bootstrap/cache || true
              fi
              sudo chmod -R ug+rwX storage bootstrap/cache || true
            else
              echo "Skipping recursive storage/bootstrap permission normalization (sudo unavailable)."
            fi

            # Fail early with a clear reason when the deploy user still cannot write.
            for path in "$APP_PATH" "$APP_PATH/storage" "$APP_PATH/bootstrap/cache"; do
              if [ ! -w "$path" ]; then
                echo "Deployment aborted: deploy user lacks write permission on $path"
                exit 1
              fi
            done

            # Ensure git trusts this directory (safe.directory for deploy user)
            git config --global --add safe.directory "$APP_PATH" 2>/dev/null || true

            # Add GitHub host key to known_hosts for SSH verification
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # Configure git to use the deployer's GitHub SSH key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy_key"

            # Pull latest code from main
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Update dependencies
            composer install --no-interaction --prefer-dist --no-dev
            npm ci

            # Build frontend assets
            npm run build

            # Run migrations
            php artisan migrate --force

            # Sync global permission rows so newly shipped tenant/central
            # capabilities are available without a full reseed.
            php artisan db:seed --class=RolePermissionSeeder --force

            # Sync plans/add-ons catalog rows so newly shipped billing items
            # become visible without needing a destructive full reseed.
            php artisan db:seed --class=BillingCatalogSeeder --force

            # Ensure Passport OAuth keys exist (required for auth:api endpoints)
            if [ ! -f storage/oauth-private.key ] || [ ! -f storage/oauth-public.key ]; then
              php artisan passport:keys --force
            fi

            # Harden OAuth key permissions and keep web-server readability.
            # Use sudo when available; otherwise best-effort local chmod/chgrp.
            if getent group www-data >/dev/null 2>&1; then
              if sudo -n true >/dev/null 2>&1; then
                sudo chown "$USER":www-data storage/oauth-private.key storage/oauth-public.key || true
              else
                echo "Skipping OAuth key group normalization (sudo unavailable)."
              fi
            fi
            if sudo -n true >/dev/null 2>&1; then
              sudo chmod 660 storage/oauth-private.key storage/oauth-public.key || true
            else
              echo "Skipping OAuth key chmod normalization (sudo unavailable)."
            fi

            for key in storage/oauth-private.key storage/oauth-public.key; do
              if [ ! -r "$key" ]; then
                abort "deploy user cannot read $APP_PATH/$key"
              fi

              require_not_world_accessible "$key"
            done

            if getent group www-data >/dev/null 2>&1; then
              require_group_access "storage" "www-data" 6
              require_group_access "bootstrap/cache" "www-data" 6
              require_group_access "storage/oauth-private.key" "www-data" 4
              require_group_access "storage/oauth-public.key" "www-data" 4
            fi

            # Ensure storage symlink exists
            php artisan storage:link --force 2>/dev/null || true

            # Clear caches
            php artisan optimize:clear
            php artisan config:cache

            # Staging should keep host-only auth cookies but still behave like
            # HTTPS production for session transport and cookie policy.
            php -r 'require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $failures = [];
            $appUrl = (string) config("app.url", "");
            if (! str_starts_with($appUrl, "https://")) {
              $failures[] = "config(app.url) must use https on staging.";
            }
            if (config("session.secure") !== true) {
              $failures[] = "config(session.secure) must be true on staging.";
            }
            if (config("session.http_only") !== true) {
              $failures[] = "config(session.http_only) must be true on staging.";
            }
            if ((string) config("session.same_site", "") !== "lax") {
              $failures[] = "config(session.same_site) must remain lax on staging.";
            }
            $sessionDomain = config("session.domain");
            if (! is_null($sessionDomain) && $sessionDomain !== "" && strtolower((string) $sessionDomain) !== "null") {
              $failures[] = "config(session.domain) must stay unset for host-only cookies.";
            }
            if ((string) config("auth_sessions.refresh_cookie_path", "") !== "/api/auth") {
              $failures[] = "config(auth_sessions.refresh_cookie_path) must remain /api/auth on staging.";
            }
            if ((string) config("auth_sessions.refresh_cookie_same_site", "") !== "lax") {
              $failures[] = "config(auth_sessions.refresh_cookie_same_site) must remain lax on staging.";
            }
            if ((string) config("guest_auth.refresh_cookie_path", "") !== "/api/guest-auth") {
              $failures[] = "config(guest_auth.refresh_cookie_path) must remain /api/guest-auth on staging.";
            }
            if ((string) config("guest_auth.refresh_cookie_same_site", "") !== "lax") {
              $failures[] = "config(guest_auth.refresh_cookie_same_site) must remain lax on staging.";
            }
            if ($failures !== []) {
              fwrite(STDERR, "Staging auth/session config audit failed:\n- ".implode("\n- ", $failures)."\n");
              exit(1);
            }
            fwrite(STDOUT, "Staging auth/session config audit passed\n");'

            # Restart queue worker
            php artisan queue:restart

            queue_connection=$(php artisan tinker --execute="echo config('queue.default');" | tr -d '[:space:]')
            expected_queue_list="notifications,default"
            expected_scheduler_cron="* * * * * cd $APP_PATH && php artisan schedule:run >> /dev/null 2>&1"
            scheduler_timer_unit="${SCHEDULER_TIMER_UNIT:-laravel-scheduler.timer}"

            queue_subscription_is_valid() {
              local details="$1"

              printf '%s\n' "$details" | grep -Eq -- "--queue(=|[[:space:]])${expected_queue_list}([[:space:]]|$)"
            }

            scheduler_is_configured() {
              local deploy_user_crontab=""

              deploy_user_crontab=$(crontab -l 2>/dev/null || true)
              if printf '%s\n' "$deploy_user_crontab" | grep -Fqx "$expected_scheduler_cron"; then
                echo "✓ Scheduler crontab entry detected"
                return 0
              fi

              if command -v sudo >/dev/null 2>&1; then
                deploy_user_crontab=$(sudo -u "$USER" crontab -l 2>/dev/null || true)
                if printf '%s\n' "$deploy_user_crontab" | grep -Fqx "$expected_scheduler_cron"; then
                  echo "✓ Scheduler crontab entry detected for deploy user"
                  return 0
                fi
              fi

              if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files "$scheduler_timer_unit" >/dev/null 2>&1; then
                if systemctl is-active --quiet "$scheduler_timer_unit"; then
                  echo "✓ Scheduler timer is active: $scheduler_timer_unit"
                  systemctl show "$scheduler_timer_unit" -p LoadState -p ActiveState -p SubState -p UnitFileState
                  return 0
                fi
              fi

              return 1
            }

            if [ "$queue_connection" != "sync" ]; then
              worker_detected=0

              for attempt in $(seq 1 12); do
                if pgrep -fa "artisan queue:work" >/tmp/queue-worker.out || pgrep -fa "artisan horizon" >/tmp/queue-worker.out; then
                  echo "✓ Queue worker process detected for [$queue_connection]"
                  cat /tmp/queue-worker.out

                  if grep -q "artisan horizon" /tmp/queue-worker.out; then
                    echo "✓ Horizon detected; skipping explicit queue subscription audit"
                    worker_detected=1
                    break
                  fi

                  if ! queue_subscription_is_valid "$(cat /tmp/queue-worker.out)"; then
                    echo "Deployment aborted: detected queue:work process is not subscribed to [${expected_queue_list}]"
                    exit 1
                  fi

                  echo "✓ Queue worker subscribes to [${expected_queue_list}]"
                  worker_detected=1
                  break
                fi

                if command -v systemctl >/dev/null 2>&1; then
                  if systemctl is-active --quiet laravel-queue.service; then
                    echo "✓ laravel-queue.service is active for [$queue_connection]"
                    systemctl show laravel-queue.service -p ActiveState -p SubState -p MainPID -p ExecStart | tee /tmp/queue-service.out
                    main_pid=$(systemctl show -p MainPID --value laravel-queue.service)
                    if [ -n "$main_pid" ] && [ "$main_pid" != "0" ]; then
                      ps -ww -o user=,group=,pid=,cmd= -p "$main_pid" | tee /tmp/queue-worker-ps.out
                    else
                      : > /tmp/queue-worker-ps.out
                    fi

                    if ! queue_subscription_is_valid "$(cat /tmp/queue-service.out)$(printf '\n')$(cat /tmp/queue-worker-ps.out)"; then
                      echo "Deployment aborted: laravel-queue.service is running but is not subscribed to [${expected_queue_list}]"
                      exit 1
                    fi

                    echo "✓ laravel-queue.service subscribes to [${expected_queue_list}]"
                    worker_detected=1
                    break
                  fi

                  if systemctl is-active --quiet laravel-horizon.service; then
                    echo "✓ laravel-horizon.service is active for [$queue_connection]"
                    systemctl show laravel-horizon.service -p ActiveState -p SubState -p MainPID -p ExecStart
                    main_pid=$(systemctl show -p MainPID --value laravel-horizon.service)
                    if [ -n "$main_pid" ] && [ "$main_pid" != "0" ]; then
                      ps -ww -o user=,group=,pid=,cmd= -p "$main_pid"
                    fi
                    worker_detected=1
                    break
                  fi
                fi

                if [ "$attempt" -lt 12 ]; then
                  echo "Waiting for queue worker to come back after queue:restart (attempt $attempt/12)"
                  sleep 5
                fi
              done

              if [ "$worker_detected" -ne 1 ]; then
                echo "Queue worker diagnostics after queue:restart:"
                pgrep -fa "artisan queue:work|artisan horizon" || true
                if command -v systemctl >/dev/null 2>&1; then
                  systemctl show laravel-queue.service -p LoadState -p ActiveState -p SubState -p MainPID -p ExecStart || true
                  systemctl show laravel-horizon.service -p LoadState -p ActiveState -p SubState -p MainPID -p ExecStart || true
                fi
                echo "Deployment aborted: queue connection [$queue_connection] requires a running worker, but none was detected after queue:restart"
                exit 1
              fi
            else
              echo "Queue connection is sync; skipping queue worker process check"
            fi

            if ! scheduler_is_configured; then
              echo "Scheduler diagnostics:"
              crontab -l 2>/dev/null || true
              if command -v systemctl >/dev/null 2>&1; then
                systemctl show "$scheduler_timer_unit" -p LoadState -p ActiveState -p SubState -p UnitFileState || true
              fi
              echo "Deployment aborted: staging requires either the expected scheduler crontab entry or an active scheduler timer [$scheduler_timer_unit]"
              exit 1
            fi

            echo "✓ Deployment to staging complete"
          ENDSSH

      - name: Post-deploy smoke checks
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          BASE_URL="${STAGING_BASE_URL:-https://stage.byteforge.se}"
          EMAIL="${STAGING_SMOKE_EMAIL:-admin@byteforge.se}"
          PASSWORD="${STAGING_SMOKE_PASSWORD:-password}"

          echo "Using smoke test base URL: $BASE_URL"

          TOKEN=$(curl -sS -D /tmp/login-headers.out -X POST "$BASE_URL/api/auth/login" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

          if [ -z "$TOKEN" ]; then
            echo "Smoke login failed: token not issued"
            exit 1
          fi

          if ! grep -qi '^set-cookie: byteforge_refresh=.*; path=/api/auth; .*secure; .*httponly; .*samesite=lax' /tmp/login-headers.out; then
            echo "Smoke login failed: staff refresh cookie is missing expected Secure/HttpOnly/SameSite/path attributes"
            cat /tmp/login-headers.out
            exit 1
          fi

          echo "[central login refresh cookie] OK (Secure + HttpOnly + SameSite=Lax + Path=/api/auth)"

          check_endpoint() {
            local label="$1"
            local url="$2"
            local expected_code="$3"
            local auth_mode="${4:-auth}"
            local code

            if [ "$auth_mode" = "noauth" ]; then
              code=$(curl -sS -o /tmp/smoke.out -w '%{http_code}' "$url" -H 'Accept: application/json')
            else
              code=$(curl -sS -o /tmp/smoke.out -w '%{http_code}' "$url" -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json')
            fi

            if [ "$code" != "$expected_code" ]; then
              echo "[$label] Expected HTTP $expected_code, got $code"
              head -c 500 /tmp/smoke.out || true
              echo
              exit 1
            fi

            echo "[$label] OK ($code)"
          }

          # Central endpoints should be healthy.
          check_endpoint "superadmin dashboard" "$BASE_URL/api/superadmin/dashboard/stats" "200"
          check_endpoint "superadmin active theme" "$BASE_URL/api/superadmin/themes/active" "200"

          # Central domain should NOT use tenant-scoped endpoint.
          check_endpoint "tenant active theme blocked on central" "$BASE_URL/api/themes/active" "404" "noauth"

          echo "✓ Post-deploy smoke checks passed"

      - name: Post-deploy staging mail smoke
        env:
          STAGING_TENANT_BASE_URL: ${{ secrets.STAGING_TENANT_BASE_URL }}
          STAGING_MAIL_SMOKE_RECIPIENT: ${{ secrets.STAGING_MAIL_SMOKE_RECIPIENT }}
        run: |
          TENANT_BASE_URL="${STAGING_TENANT_BASE_URL:-}"
          MAIL_RECIPIENT="${STAGING_MAIL_SMOKE_RECIPIENT:-qa-mail-smoke@byteforge.se}"

          if [ -z "$TENANT_BASE_URL" ]; then
            echo "Staging mail smoke failed: STAGING_TENANT_BASE_URL is required"
            exit 1
          fi

          REQUEST_URL="${TENANT_BASE_URL%/}/api/guest-auth/request-link"

          echo "Triggering guest magic-link mail smoke against: $REQUEST_URL"

          code=$(curl -sS -o /tmp/mail-smoke.out -w '%{http_code}' "$REQUEST_URL" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$MAIL_RECIPIENT\"}")

          if [ "$code" != "200" ]; then
            echo "[mail smoke] Expected HTTP 200, got $code"
            head -c 500 /tmp/mail-smoke.out || true
            echo
            exit 1
          fi

          if ! grep -q '"sent":true' /tmp/mail-smoke.out; then
            echo "[mail smoke] Expected JSON payload to include sent=true"
            head -c 500 /tmp/mail-smoke.out || true
            echo
            exit 1
          fi

          echo "[mail smoke] Guest magic-link request accepted for $MAIL_RECIPIENT"

      - name: Post-deploy runtime scheduler and failed-jobs audit
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_APP_PATH: /var/www/byteforge
        run: |
          missing=0
          for var in STAGING_HOST STAGING_USER STAGING_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Runtime audit aborted: configure required staging SSH secrets in GitHub Actions settings."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -T -o BatchMode=yes -o LogLevel=ERROR -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" 'bash -se' << 'ENDSSH'
            APP_PATH=/var/www/byteforge

            cd "$APP_PATH" || exit 1

            schedule_output=$(php artisan schedule:list --no-ansi 2>&1) || {
              echo "Scheduler audit failed: php artisan schedule:list returned non-zero"
              printf '%s\n' "$schedule_output"
              exit 1
            }

            printf '%s\n' "$schedule_output"

            for expected_command in bookings:expire-holds bookings:send-reminders support-access:expire; do
              if ! grep -Fq "$expected_command" <<<"$schedule_output"; then
                echo "Scheduler audit failed: expected scheduled command [$expected_command] was not listed"
                exit 1
              fi
            done

            echo "✓ Scheduler registration verified"

            failed_jobs_before=$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo Illuminate\Support\Facades\Schema::hasTable("failed_jobs") ? Illuminate\Support\Facades\DB::table("failed_jobs")->count() : 0;')
            failed_jobs_before=$(printf '%s' "$failed_jobs_before" | tr -d '[:space:]')

            echo "failed_jobs before scheduler smoke: $failed_jobs_before"

            php artisan schedule:run --no-ansi

            failed_jobs_after=$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo Illuminate\Support\Facades\Schema::hasTable("failed_jobs") ? Illuminate\Support\Facades\DB::table("failed_jobs")->count() : 0;')
            failed_jobs_after=$(printf '%s' "$failed_jobs_after" | tr -d '[:space:]')

            echo "failed_jobs after scheduler smoke: $failed_jobs_after"

            if [ "$failed_jobs_after" -gt 0 ]; then
              echo "failed_jobs triage summary:"
              php -r 'require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              if (! Illuminate\Support\Facades\Schema::hasTable("failed_jobs")) {
                echo "- failed_jobs table not present\n";
                exit(0);
              }
              $total = (int) Illuminate\Support\Facades\DB::table("failed_jobs")->count();
              $oldest = Illuminate\Support\Facades\DB::table("failed_jobs")->min("failed_at");
              $newest = Illuminate\Support\Facades\DB::table("failed_jobs")->max("failed_at");
              echo "- total rows: {$total}\n";
              echo "- oldest failed_at: " . ($oldest ?? "n/a") . "\n";
              echo "- newest failed_at: " . ($newest ?? "n/a") . "\n";

              $rows = Illuminate\Support\Facades\DB::table("failed_jobs")
                ->orderByDesc("failed_at")
                ->limit(50)
                ->get(["payload"]);

              $classes = [];
              foreach ($rows as $row) {
                $payload = json_decode((string) $row->payload, true);
                $name = $payload["displayName"] ?? ($payload["data"]["commandName"] ?? "unknown");
                $classes[$name] = ($classes[$name] ?? 0) + 1;
              }
              arsort($classes);
              echo "- top recent failed job classes (up to 5):\n";
              foreach (array_slice($classes, 0, 5, true) as $name => $count) {
                echo "  * {$name}: {$count}\n";
              }'

              php artisan queue:failed --no-ansi || true
            fi

            if [ "$failed_jobs_after" -gt "$failed_jobs_before" ]; then
              new_failed_jobs=$((failed_jobs_after - failed_jobs_before))
              echo "Runtime audit failed: failed_jobs increased by $new_failed_jobs row(s) during post-deploy scheduler smoke"
              exit 1
            fi

            if [ "$failed_jobs_after" -gt 0 ]; then
              echo "Runtime audit warning: failed_jobs backlog exists ($failed_jobs_after row(s)) but did not increase during this deploy"
            fi

            echo "✓ Failed-jobs audit passed"
          ENDSSH

      - name: Manual staging closeout verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_closeout_verification }}
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_APP_PATH: /var/www/byteforge
          CLEAR_FAILED_JOBS_BACKLOG: ${{ inputs.clear_failed_jobs_backlog }}
        run: |
          missing=0
          for var in STAGING_HOST STAGING_USER STAGING_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Closeout verification aborted: configure required staging SSH secrets in GitHub Actions settings."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          closeout_clear_flag=$(printf '%q' "$CLEAR_FAILED_JOBS_BACKLOG")
          closeout_scheduler_unit=$(printf '%q' "${SCHEDULER_TIMER_UNIT:-laravel-scheduler.timer}")

          ssh -T -o BatchMode=yes -o LogLevel=ERROR -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" "CLEAR_FAILED_JOBS_BACKLOG=$closeout_clear_flag SCHEDULER_TIMER_UNIT=$closeout_scheduler_unit bash -se" << 'ENDSSH'
            set -euo pipefail

            APP_PATH=/var/www/byteforge
            CLEAR_FAILED_JOBS_BACKLOG="${CLEAR_FAILED_JOBS_BACKLOG:-false}"
            expected_queue_list="notifications,default"
            expected_scheduler_cron="* * * * * cd $APP_PATH && php artisan schedule:run >> /dev/null 2>&1"
            scheduler_timer_unit="${SCHEDULER_TIMER_UNIT:-laravel-scheduler.timer}"

            abort() {
              echo "Closeout verification failed: $1"
              exit 1
            }

            require_group_access() {
              local path="$1"
              local expected_group="$2"
              local minimum_group_digit="$3"
              local mode group_digit actual_group

              actual_group=$(stat -c '%G' "$path")
              mode=$(stat -c '%a' "$path")
              group_digit=${mode: -2:1}

              if [ "$actual_group" != "$expected_group" ]; then
                abort "$APP_PATH/$path must be group-owned by $expected_group (found: $actual_group)"
              fi

              if (( group_digit < minimum_group_digit )); then
                abort "$APP_PATH/$path must grant group permission >= $minimum_group_digit (mode: $mode)"
              fi
            }

            require_not_world_accessible() {
              local path="$1"
              local mode other_digit

              mode=$(stat -c '%a' "$path")
              other_digit=${mode: -1}

              if (( other_digit > 0 )); then
                abort "$APP_PATH/$path must not be world-accessible (mode: $mode)"
              fi
            }

            queue_subscription_is_valid() {
              local details="$1"

              printf '%s\n' "$details" | grep -Eq -- "--queue(=|[[:space:]])${expected_queue_list}([[:space:]]|$)"
            }

            scheduler_is_configured() {
              local deploy_user_crontab=""

              deploy_user_crontab=$(crontab -l 2>/dev/null || true)
              if printf '%s\n' "$deploy_user_crontab" | grep -Fqx "$expected_scheduler_cron"; then
                echo "✓ Scheduler crontab entry detected"
                return 0
              fi

              if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files "$scheduler_timer_unit" >/dev/null 2>&1; then
                if systemctl is-active --quiet "$scheduler_timer_unit"; then
                  echo "✓ Scheduler timer is active: $scheduler_timer_unit"
                  systemctl show "$scheduler_timer_unit" -p LoadState -p ActiveState -p SubState -p UnitFileState
                  return 0
                fi
              fi

              return 1
            }

            failed_jobs_count() {
              php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo Illuminate\Support\Facades\Schema::hasTable("failed_jobs") ? Illuminate\Support\Facades\DB::table("failed_jobs")->count() : 0;'
            }

            print_failed_jobs_summary() {
              php -r 'require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              if (! Illuminate\Support\Facades\Schema::hasTable("failed_jobs")) {
                echo "- failed_jobs table not present\n";
                exit(0);
              }

              $total = (int) Illuminate\Support\Facades\DB::table("failed_jobs")->count();
              $oldest = Illuminate\Support\Facades\DB::table("failed_jobs")->min("failed_at");
              $newest = Illuminate\Support\Facades\DB::table("failed_jobs")->max("failed_at");
              echo "- total rows: {$total}\n";
              echo "- oldest failed_at: " . ($oldest ?? "n/a") . "\n";
              echo "- newest failed_at: " . ($newest ?? "n/a") . "\n";

              $rows = Illuminate\Support\Facades\DB::table("failed_jobs")
                ->orderByDesc("failed_at")
                ->limit(20)
                ->get(["uuid", "payload", "failed_at"]);

              $classes = [];
              foreach ($rows as $row) {
                $payload = json_decode((string) $row->payload, true);
                $name = $payload["displayName"] ?? ($payload["data"]["commandName"] ?? "unknown");
                $classes[$name] = ($classes[$name] ?? 0) + 1;
              }
              arsort($classes);
              echo "- top recent failed job classes (up to 5):\n";
              foreach (array_slice($classes, 0, 5, true) as $name => $count) {
                echo "  * {$name}: {$count}\n";
              }
              echo "- most recent failed job rows (up to 10):\n";
              foreach ($rows->take(10) as $row) {
                $payload = json_decode((string) $row->payload, true);
                $name = $payload["displayName"] ?? ($payload["data"]["commandName"] ?? "unknown");
                echo "  * {$row->failed_at} | {$row->uuid} | {$name}\n";
              }'
            }

            verify_runtime_path_writable() {
              local runtime_user="$1"
              local path="$2"
              local owner group mode owner_digit group_digit runtime_groups

              owner=$(stat -c '%U' "$path")
              group=$(stat -c '%G' "$path")
              mode=$(stat -c '%a' "$path")
              owner_digit=${mode:0:1}
              group_digit=${mode: -2:1}

              if [ "$owner" = "$runtime_user" ] && (( owner_digit >= 6 )); then
                return 0
              fi

              runtime_groups=$(id -nG "$runtime_user" 2>/dev/null || true)
              if printf '%s\n' "$runtime_groups" | tr ' ' '\n' | grep -Fxq "$group" && (( group_digit >= 6 )); then
                return 0
              fi

              return 1
            }

            verify_runtime_writability() {
              local runtime_user="$1"

              if command -v sudo >/dev/null 2>&1 && sudo -n -u "$runtime_user" true >/dev/null 2>&1; then
                sudo -n -u "$runtime_user" bash -lc "cd '$APP_PATH' && test -w storage && test -w storage/logs && test -w bootstrap/cache && echo runtime paths writable for $runtime_user"
                return
              fi

              if [ "$(id -un)" = "$runtime_user" ]; then
                bash -lc "cd '$APP_PATH' && test -w storage && test -w storage/logs && test -w bootstrap/cache && echo runtime paths writable for $runtime_user"
                return
              fi

              for runtime_path in storage storage/logs bootstrap/cache; do
                verify_runtime_path_writable "$runtime_user" "$runtime_path" || abort "unable to verify runtime writability for [$runtime_user] on $APP_PATH/$runtime_path"
              done

              echo "runtime paths writable for $runtime_user (verified from ownership/group mode baseline)"
            }

            cd "$APP_PATH" || abort "app path does not exist: $APP_PATH"

            echo "Closeout checklist: deploy-user bootstrap"
            [ -r "$HOME/.ssh/github_deploy_key" ] || abort "deploy user cannot read $HOME/.ssh/github_deploy_key"
            echo "✓ Deploy user can read $HOME/.ssh/github_deploy_key"

            safe_directories=$(git config --global --get-all safe.directory || true)
            printf '%s\n' "$safe_directories"
            printf '%s\n' "$safe_directories" | grep -Fqx "$APP_PATH" || abort "git safe.directory does not include $APP_PATH"
            echo "✓ Git safe.directory includes $APP_PATH"

            stat -c '%U %G %a %n' storage storage/logs bootstrap/cache storage/oauth-private.key storage/oauth-public.key

            if getent group www-data >/dev/null 2>&1; then
              require_group_access "storage" "www-data" 6
              require_group_access "bootstrap/cache" "www-data" 6
              require_group_access "storage/oauth-private.key" "www-data" 4
              require_group_access "storage/oauth-public.key" "www-data" 4
            fi
            require_not_world_accessible "storage/oauth-private.key"
            require_not_world_accessible "storage/oauth-public.key"
            echo "✓ Storage/bootstrap and OAuth key permission baseline verified"

            echo "Closeout checklist: runtime services"
            queue_connection=$(php artisan tinker --execute="echo config('queue.default');" | tr -d '[:space:]')
            echo "queue.default=$queue_connection"

            if [ "$queue_connection" != "sync" ]; then
              if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files laravel-queue.service >/dev/null 2>&1; then
                systemctl is-active --quiet laravel-queue.service || abort "laravel-queue.service is not active"
                queue_details=$(systemctl show laravel-queue.service -p LoadState -p ActiveState -p SubState -p MainPID -p ExecStart -p User -p Group || true)
                printf '%s\n' "$queue_details"

                main_pid=$(systemctl show -p MainPID --value laravel-queue.service)
                [ -n "$main_pid" ] && [ "$main_pid" != "0" ] || abort "laravel-queue.service does not have a running main PID"
                process_details=$(ps -ww -o user=,group=,pid=,cmd= -p "$main_pid")
                printf '%s\n' "$process_details"

                queue_subscription_is_valid "$queue_details"$'\n'"$process_details" || abort "laravel-queue.service is not subscribed to [${expected_queue_list}]"
                echo "✓ laravel-queue.service subscribes to [${expected_queue_list}]"

                runtime_user=$(printf '%s\n' "$queue_details" | sed -n 's/^User=//p' | tr -d '[:space:]')
                if [ -z "$runtime_user" ]; then
                  runtime_user=$(printf '%s\n' "$process_details" | awk '{print $1}')
                fi
              elif pgrep -fa 'artisan horizon' >/tmp/horizon-closeout.out; then
                cat /tmp/horizon-closeout.out
                runtime_user=$(ps -o user= -p "$(pgrep -f 'artisan horizon' | head -n 1)" | tr -d '[:space:]')
                echo "✓ Horizon detected; explicit queue subscription audit skipped"
              else
                abort "no supervised queue worker or Horizon process detected"
              fi

              [ -n "$runtime_user" ] || abort "unable to determine runtime user for queue worker verification"
              verify_runtime_writability "$runtime_user"
            else
              echo "Queue connection is sync; runtime worker verification skipped"
            fi

            echo "Scheduler verification"
            crontab -l || true
            scheduler_is_configured || abort "scheduler must be configured via the expected crontab entry or active timer [$scheduler_timer_unit]"

            echo "Failed-jobs triage"
            failed_jobs_before=$(failed_jobs_count | tr -d '[:space:]')
            echo "failed_jobs before cleanup: $failed_jobs_before"
            print_failed_jobs_summary
            php artisan queue:failed --no-ansi || true

            if [ "$CLEAR_FAILED_JOBS_BACKLOG" = "true" ] && [ "$failed_jobs_before" -gt 0 ]; then
              echo "Clearing previously triaged failed_jobs backlog"
              php artisan queue:flush --no-interaction
            else
              echo "Failed-jobs backlog clear skipped"
            fi

            failed_jobs_after=$(failed_jobs_count | tr -d '[:space:]')
            echo "failed_jobs after cleanup: $failed_jobs_after"

            if [ "$CLEAR_FAILED_JOBS_BACKLOG" = "true" ] && [ "$failed_jobs_before" -gt 0 ] && [ "$failed_jobs_after" -ne 0 ]; then
              abort "failed_jobs backlog was not fully cleared"
            fi

            echo "✓ Manual staging closeout verification passed"
          ENDSSH

      - name: Setup Node for browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies for browser smoke
        run: npm ci

      - name: Install Playwright browser for staging smoke
        run: npx playwright install --with-deps chromium

      - name: Post-deploy Playwright browser smoke
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_TENANT_BASE_URL: ${{ secrets.STAGING_TENANT_BASE_URL }}
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_TENANT_OWNER_EMAIL: ${{ secrets.STAGING_TENANT_OWNER_EMAIL }}
          STAGING_TENANT_OWNER_PASSWORD: ${{ secrets.STAGING_TENANT_OWNER_PASSWORD }}
          STAGING_TENANT_VIEWER_EMAIL: ${{ secrets.STAGING_TENANT_VIEWER_EMAIL }}
          STAGING_TENANT_VIEWER_PASSWORD: ${{ secrets.STAGING_TENANT_VIEWER_PASSWORD }}
          CI: "1"
        run: |
          BASE_URL="${STAGING_BASE_URL:-https://stage.byteforge.se}"
          TENANT_BASE_URL="${STAGING_TENANT_BASE_URL:-}"
          EMAIL="${STAGING_SMOKE_EMAIL:-admin@byteforge.se}"
          PASSWORD="${STAGING_SMOKE_PASSWORD:-password}"
          TENANT_OWNER_EMAIL="${STAGING_TENANT_OWNER_EMAIL:-}"
          TENANT_OWNER_PASSWORD="${STAGING_TENANT_OWNER_PASSWORD:-password}"
          TENANT_VIEWER_EMAIL="${STAGING_TENANT_VIEWER_EMAIL:-}"
          TENANT_VIEWER_PASSWORD="${STAGING_TENANT_VIEWER_PASSWORD:-password}"

          auth_env=(
            PLAYWRIGHT_BASE_URL="$BASE_URL"
            PLAYWRIGHT_TENANT_BASE_URL="$TENANT_BASE_URL"
            PLAYWRIGHT_CENTRAL_EMAIL="$EMAIL"
            PLAYWRIGHT_CENTRAL_PASSWORD="$PASSWORD"
          )

          # Do not pass empty tenant email env vars. Empty strings override the
          # Playwright runtime fallback addresses and cause tenant login failures.
          if [ -n "$TENANT_OWNER_EMAIL" ]; then
            auth_env+=(PLAYWRIGHT_TENANT_OWNER_EMAIL="$TENANT_OWNER_EMAIL")
            auth_env+=(PLAYWRIGHT_TENANT_OWNER_PASSWORD="$TENANT_OWNER_PASSWORD")
          fi

          if [ -n "$TENANT_VIEWER_EMAIL" ]; then
            auth_env+=(PLAYWRIGHT_TENANT_VIEWER_EMAIL="$TENANT_VIEWER_EMAIL")
            auth_env+=(PLAYWRIGHT_TENANT_VIEWER_PASSWORD="$TENANT_VIEWER_PASSWORD")
          fi

          env "${auth_env[@]}" npx playwright test tests/e2e/central-auth-flow.spec.ts

          if [ -n "$TENANT_BASE_URL" ] && [ -n "$TENANT_OWNER_EMAIL" ] && [ -n "$TENANT_VIEWER_EMAIL" ]; then
            check_tenant_login() {
              local label="$1"
              local email="$2"
              local password="$3"
              local code

              code=$(curl -sS -o /tmp/tenant-auth.out -w '%{http_code}' "${TENANT_BASE_URL%/}/api/auth/login" \
                -H 'Accept: application/json' \
                -H 'Content-Type: application/json' \
                -d "{\"email\":\"$email\",\"password\":\"$password\"}")

              if [ "$code" != "200" ]; then
                echo "[tenant auth preflight:$label] Expected HTTP 200, got $code"
                head -c 500 /tmp/tenant-auth.out || true
                echo
                return 1
              fi

              if ! grep -q '"token":' /tmp/tenant-auth.out; then
                echo "[tenant auth preflight:$label] Login response did not include token"
                head -c 500 /tmp/tenant-auth.out || true
                echo
                return 1
              fi

              echo "[tenant auth preflight:$label] OK"
            }

            # Fail early with a clear message if staged tenant credentials are wrong.
            check_tenant_login "owner" "$TENANT_OWNER_EMAIL" "$TENANT_OWNER_PASSWORD"
            check_tenant_login "viewer" "$TENANT_VIEWER_EMAIL" "$TENANT_VIEWER_PASSWORD"

            env "${auth_env[@]}" npx playwright test \
              tests/e2e/tenant-auth-flow.spec.ts \
              tests/e2e/tenant-permissions.spec.ts
          else
            echo "Skipping tenant auth browser smoke: set STAGING_TENANT_BASE_URL, STAGING_TENANT_OWNER_EMAIL, and STAGING_TENANT_VIEWER_EMAIL to enable it."
          fi

          PLAYWRIGHT_BASE_URL="$BASE_URL" \
          PLAYWRIGHT_TENANT_BASE_URL="$TENANT_BASE_URL" \
          npx playwright test tests/e2e/guest-portal-shell.spec.ts

      - name: Upload post-deploy Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Deployment successful
        run: echo "✓ Staging deployment completed successfully"

      - name: Deployment failed
        if: failure()
        run: echo "✗ Staging deployment failed"
